[package]
name = "vk-binds-test"
version = "0.1.0"
edition = "2024"

[features]
ray-tracing = []

[dependencies]
anyhow = "1.0.102"
bytemuck = { version = "1.25.0", features = ["derive"] }
guillotiere = "0.7.0"
libc = "0.2.185"
log = "0.4.29"
lyon = "1.0.19"
range-alloc = "0.1.5"
rustix = "1.1.4"
slab = "0.4.12"
wayland-client = { version = "0.31.14", features = ["system", "dlopen"] }
wayland-protocols = { version = "0.32.12", features = ["client", "staging"] }

